    <title>未见 · 见微知命，顺时择善</title>
    <style>
        :root {
            --bg: #121214;
            --card-1: #1c1c21;
            --card-2: #151518;
            --line: rgba(246, 211, 101, 0.15);
            --gold-1: #f6d365;
            --gold-2: #fda085;
            --amber: #d4af37;
            --amber-deep: #aa771c;
            --palace: #C41E2B;
            --text: #e4e4e7;
            --muted: #a1a1aa;
            --faint: #71717a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', STSong, SimSun, serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(1200px 600px at 50% -10%, rgba(196, 30, 43, 0.10) 0%, transparent 60%),
                radial-gradient(900px 500px at 50% 110%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 32px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景光效装饰 */
        .glow-top {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 300px;
            background: rgba(251, 191, 36, 0.12);
            filter: blur(120px);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 漂浮金尘粒子 */
        .particle {
            position: fixed;
            bottom: -12px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(246, 211, 101, 0.9) 0%, transparent 70%);
            animation: rise linear infinite;
            opacity: 0;
        }
        @keyframes rise {
            0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
            12%  { opacity: 0.85; }
            100% { transform: translateY(-105vh) translateX(3vw) scale(1); opacity: 0; }
        }

        .wrap { width: 100%; max-width: 430px; position: relative; z-index: 10; }

        /* 顶部品牌区 */
        header { text-align: center; padding-top: 8px; }

        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(251, 191, 36, 0.10);
            border: 1px solid rgba(251, 191, 36, 0.22);
            color: #fcd34d;
            font-size: 12px;
            letter-spacing: 0.35em;
            text-indent: 0.35em;
            margin-bottom: 20px;
        }

        .seal {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            border-radius: 8px;
            background: linear-gradient(145deg, #d24a52, #8B1A2B);
            color: #fdf3ec;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.15;
            box-shadow: 0 6px 18px rgba(196, 30, 43, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.08);
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-indent: 0.35em;
            line-height: 1.1;
            background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .tagline {
            margin-top: 12px;
            font-size: 14px;
            letter-spacing: 0.2em;
            text-indent: 0.2em;
            color: #d6d3d1;
        }
        .tagline em { font-style: normal; color: #fcd34d; }

        .sub {
            margin-top: 6px;
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--faint);
        }

        /* 核心分享卡片 */
        main { margin: 30px 0 26px; }

        .card {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            padding: 26px 22px;
            background: linear-gradient(145deg, var(--card-1) 0%, var(--card-2) 100%);
            border: 1px solid var(--line);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 110px;
            height: 110px;
            background: linear-gradient(to bottom left, rgba(251, 191, 36, 0.12), transparent);
            border-radius: 0 0 0 100%;
            pointer-events: none;
        }

        .card-head {
            text-align: center;
            padding-bottom: 22px;
            border-bottom: 1px solid #29292e;
        }
        .card-head .kicker {
            font-size: 11px;
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            color: rgba(252, 211, 77, 0.85);
        }
        .card-head h2 {
            margin-top: 12px;
            font-size: 19px;
            font-weight: 600;
            line-height: 1.6;
            color: #f4f4f5;
        }

        .features {
            padding: 22px 2px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 14px;
            color: #d4d4d8;
        }
        .features .row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .features .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.7);
            flex-shrink: 0;
        }

        .cta {
            margin-top: 6px;
            padding-top: 16px;
            border-top: 1px solid #29292e;
        }
        .cta a {
            display: block;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            color: #1c1407;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.15em;
            text-indent: 0.15em;
            border-radius: 14px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--amber) 0%, var(--amber-deep) 100%);
            box-shadow: 0 10px 28px rgba(212, 175, 55, 0.30);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .cta a:active {
            transform: scale(0.98);
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
        }

        footer {
            text-align: center;
            padding-bottom: 6px;
            color: #52525b;
            font-size: 11px;
            letter-spacing: 0.06em;
        }
        footer .sep { margin: 0 6px; color: #3f3f46; }
    </style>
</head>
<body>

    <div class="glow-top"></div>

    <!-- 漂浮金尘 -->
    <div class="particle" style="left: 12%; width: 6px; height: 6px; animation-duration: 16s; animation-delay: 0s;"></div>
    <div class="particle" style="left: 30%; width: 3px; height: 3px; animation-duration: 21s; animation-delay: 2s;"></div>
    <div class="particle" style="left: 48%; width: 4px; height: 4px; animation-duration: 18s; animation-delay: 5s;"></div>
    <div class="particle" style="left: 66%; width: 5px; height: 5px; animation-duration: 24s; animation-delay: 1s;"></div>
    <div class="particle" style="left: 82%; width: 3px; height: 3px; animation-duration: 19s; animation-delay: 4s;"></div>
    <div class="particle" style="left: 90%; width: 4px; height: 4px; animation-duration: 22s; animation-delay: 7s;"></div>

    <div class="wrap">

        <!-- 顶部品牌区 -->
        <header>
            <div class="badge">传统东方美学 · 命理灵机</div>
            <div class="seal">未<br>见</div>
            <h1>未见</h1>
            <p class="tagline">见微知命 · <em>顺时择善</em></p>
            <p class="sub">知命而乐，顺势而为 · 探索你的东方命理密码</p>
        </header>

        <!-- 核心分享卡片 -->
        <main>
            <div class="card">
                <div class="card-head">
                    <span class="kicker">每日运势与专属排盘</span>
                    <h2>“探寻天地阴阳，<br>解码你的专属命盘”</h2>
                </div>

                <div class="features">
                    <div class="row">
                        <span class="dot"></span>
                        <span>专业八字排盘：精准洞察日主与十神</span>
                    </div>
                    <div class="row">
                        <span class="dot"></span>
                        <span>每日吉时黄历：宜忌随心，顺遂安康</span>
                    </div>
                    <div class="row">
                        <span class="dot"></span>
                        <span>现代轻量化体验：随时随地查看运势</span>
                    </div>
                </div>

                <div class="cta">
                    <a href="https://draicicasignbult.github.io/xuanyi-app/#/" target="_blank">立即进入排盘体验 →</a>
                </div>
            </div>
        </main>

        <!-- 底部 -->
        <footer>
            未见 App <span class="sep">·</span> 点击上方按钮开启你的命理探索
        </footer>
    </div>

</body>
</html>
